const SYS_COLOR = {
  'Neuroradiology':'#378ADD','Head & Neck':'#D85A30','MSK':'#1D9E75',
  'GI / Hepatobiliary':'#D4537E','Chest':'#7F77DD','Spine':'#BA7517',
  'Cardiovascular':'#E24B4A','GU / Renal':'#639922','Anatomy (general)':'#888780'
};
const SYS_ORDER = Object.keys(SYS_COLOR);

function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const byDateRead = {};
TOPICS.forEach(t=>{
  let cur = parseDate(t[1]); const end = parseDate(t[2]);
  while(cur<=end){
    const k = fmtDate(cur);
    (byDateRead[k] = byDateRead[k]||[]).push({file:t[0], pages:t[3], system:t[4]});
    cur = new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
  }
});
const byDateReview = {};
REVIEWS.forEach(r=>{
  const k = r[1];
  (byDateReview[k] = byDateReview[k]||[]).push({file:r[0], stage:r[2], system:r[3]});
});

const totalPages = TOPICS.reduce((a,t)=>a+t[3],0);
const totalTopics = TOPICS.length;
const totalReviews = REVIEWS.length;
const lastReview = REVIEWS.reduce((a,r)=> r[1]>a? r[1]:a, '');
function fmtShort(s){ const d=parseDate(s); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

document.getElementById('metrics').innerHTML = `
  <div style="flex:1;min-width:130px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem">
    <div style="font-size:13px;color:var(--color-text-secondary)">topics to read</div>
    <div style="font-size:24px;font-weight:500">${totalTopics}</div>
  </div>
  <div style="flex:1;min-width:130px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem">
    <div style="font-size:13px;color:var(--color-text-secondary)">pages, first pass</div>
    <div style="font-size:24px;font-weight:500">${totalPages.toLocaleString()}</div>
  </div>
  <div style="flex:1;min-width:130px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem">
    <div style="font-size:13px;color:var(--color-text-secondary)">review passes added</div>
    <div style="font-size:24px;font-weight:500">${totalReviews}</div>
  </div>
  <div style="flex:1;min-width:150px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem">
    <div style="font-size:13px;color:var(--color-text-secondary)">plan finishes</div>
    <div style="font-size:24px;font-weight:500">${fmtShort(lastReview)}</div>
  </div>
`;

document.getElementById('legend').innerHTML = SYS_ORDER.map(s=>
  `<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-secondary)"><span style="width:8px;height:8px;border-radius:2px;background:${SYS_COLOR[s]}"></span>${s}</span>`
).join('');

let viewYear = 2026, viewMonth = 5;

function renderCalendar(){
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthLabel').textContent = monthNames[viewMonth]+' '+viewYear;
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--color-text-secondary);text-align:center;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=> html += `<div>${d}</div>`);
  html += '</div><div style="display:grid;grid-template-columns:repeat(7,1fr)">';

  cells.forEach((d)=>{
    if(d===null){ html += `<div style="min-height:64px;border-right:0.5px solid var(--color-border-tertiary);border-bottom:0.5px solid var(--color-border-tertiary)"></div>`; return; }
    const dateStr = fmtDate(new Date(viewYear, viewMonth, d));
    const reads = byDateRead[dateStr] || [];
    const revs = byDateReview[dateStr] || [];
    const hasContent = reads.length || revs.length;
    let inner = `<div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:3px">${d}</div>`;
    reads.slice(0,1).forEach(r=>{
      inner += `<div style="font-size:10px;background:${SYS_COLOR[r.system]}22;border-left:2px solid ${SYS_COLOR[r.system]};border-radius:0;padding:1px 3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${r.file}</div>`;
    });
    if(revs.length){
      inner += `<div style="font-size:10px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:2px"><i class="ti ti-rotate" style="font-size:10px" aria-hidden="true"></i>${revs.length} review${revs.length>1?'s':''}</div>`;
    }
    html += `<button data-date="${dateStr}" style="text-align:left;min-height:64px;padding:4px;border-radius:0;border:none;border-right:0.5px solid var(--color-border-tertiary);border-bottom:0.5px solid var(--color-border-tertiary);background:${hasContent?'var(--color-background-primary)':'transparent'};cursor:${hasContent?'pointer':'default'};display:flex;flex-direction:column">${inner}</button>`;
  });
  html += '</div>';
  document.getElementById('calendar').innerHTML = html;

  document.querySelectorAll('#calendar button[data-date]').forEach(btn=>{
    btn.addEventListener('click', ()=> showDayDetail(btn.getAttribute('data-date')));
  });
}

function showDayDetail(dateStr){
  const reads = byDateRead[dateStr] || [];
  const revs = byDateReview[dateStr] || [];
  if(!reads.length && !revs.length){ document.getElementById('dayDetail').innerHTML=''; return; }
  const d = parseDate(dateStr);
  const label = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  let html = `<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem">`;
  html += `<div style="font-weight:500;font-size:15px;margin-bottom:10px">${label}</div>`;
  reads.forEach(r=>{
    html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <span style="width:8px;height:8px;border-radius:2px;background:${SYS_COLOR[r.system]};flex-shrink:0"></span>
      <span style="font-size:13px;flex:1">${r.file}</span>
      <span style="font-size:12px;color:var(--color-text-secondary)">${r.pages}p · new</span>
    </div>`;
  });
  const stageLabel = {sr1:'review 1 · next-day', sr2:'review 2 · 1 week', sr3:'review 3 · 3 weeks', sr4:'review 4 · 6 weeks'};
  revs.forEach(r=>{
    html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <i class="ti ti-rotate" style="font-size:14px;color:var(--color-text-tertiary)" aria-hidden="true"></i>
      <span style="font-size:13px;flex:1">${r.file}</span>
      <span style="font-size:12px;color:var(--color-text-secondary)">${stageLabel[r.stage]}</span>
    </div>`;
  });
  html += '</div>';
  document.getElementById('dayDetail').innerHTML = html;
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
  renderCalendar();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
  renderCalendar();
});

renderCalendar();

const sysPages = {};
TOPICS.forEach(t=>{ sysPages[t[4]] = (sysPages[t[4]]||0) + t[3]; });
const sortedSys = SYS_ORDER.slice().sort((a,b)=> sysPages[b]-sysPages[a]);

new Chart(document.getElementById('sysChart'), {
  type:'bar',
  data:{
    labels: sortedSys,
    datasets:[{ data: sortedSys.map(s=>sysPages[s]), backgroundColor: sortedSys.map(s=>SYS_COLOR[s]) }]
  },
  options:{
    indexAxis:'y',
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false} },
    scales:{ x:{ grid:{display:false} }, y:{ grid:{display:false} } }
  }
});
</script>
